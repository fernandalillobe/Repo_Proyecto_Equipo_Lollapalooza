<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 20px; font-family: 'Open Sans', sans-serif; background: white; }
  </style>
</head>
<body>
  <canvas id="grafico-chilenos"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const labels = ['2011','2012','2013','2014','2015','2016','2017','2018','2019','2022','2023','2024','2025','2026'];
    const artistas = [17,15,18,21,30,18,29,43,49,41,31,34,21,40];
    const generos  = [28,26,32,35,36,33,37,55,50,34,35,46,39,58];

    // Plugin que recorta el canvas de izquierda a derecha según el progreso
    const drawPlugin = {
      id: 'drawLine',
      beforeDatasetsDraw(chart, args, options) {
        const { ctx, chartArea: { left, right, top, bottom } } = chart;
        const progress = options.progress ?? 1;
        const clipWidth = (right - left) * progress;
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top - 10, clipWidth, bottom - top + 20);
        ctx.clip();
      },
      afterDatasetsDraw(chart) {
        chart.ctx.restore();
      }
    };

    Chart.register(drawPlugin);

    let drawn = false;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !drawn) {
          drawn = true;

          const chart = new Chart(document.getElementById('grafico-chilenos'), {
            type: 'line',
            data: {
              labels,
              datasets: [
                {
                  label: 'Nº de artistas chilenos',
                  data: artistas,
                  borderColor: '#00af9a',
                  backgroundColor: 'rgba(0,175,154,0.1)',
                  pointBackgroundColor: '#00af9a',
                  pointRadius: 5,
                  pointHoverRadius: 7,
                  borderWidth: 3,
                  tension: 0.3,
                  fill: true,
                  yAxisID: 'y'
                },
                {
                  label: 'Cantidad de géneros musicales',
                  data: generos,
                  borderColor: '#ffade3',
                  backgroundColor: 'rgba(255,173,227,0.08)',
                  pointBackgroundColor: '#ffade3',
                  pointRadius: 5,
                  pointHoverRadius: 7,
                  borderWidth: 3,
                  borderDash: [6, 4],
                  tension: 0.3,
                  fill: false,
                  yAxisID: 'y2'
                }
              ]
            },
            options: {
              responsive: true,
              animation: false,
              plugins: {
                drawLine: { progress: 0 },
                title: {
                  display: true,
                  text: 'Evolución de la presencia de artistas chilenos y cantidad de géneros musicales en Lollapalooza',
                  font: { size: 13, weight: 'bold' },
                  padding: { bottom: 16 }
                },
                legend: {
                  position: 'top',
                  labels: { font: { family: 'Open Sans', size: 12 }, padding: 16 }
                },
                tooltip: {
                  callbacks: {
                    label(ctx) { return ` ${ctx.dataset.label}: ${ctx.raw}`; }
                  }
                }
              },
              scales: {
                x: {
                  title: { display: true, text: 'Edición Lollapalooza', font: { family: 'Open Sans', size: 12 } },
                  grid: { display: false }
                },
                y: {
                  type: 'linear', position: 'left',
                  title: { display: true, text: 'Nº de artistas chilenos', color: '#00af9a', font: { family: 'Open Sans', size: 12 } },
                  grid: { color: 'rgba(0,0,0,0.06)' }
                },
                y2: {
                  type: 'linear', position: 'right',
                  title: { display: true, text: 'Cantidad de géneros musicales', color: '#ffade3', font: { family: 'Open Sans', size: 12 } },
                  grid: { display: false }
                }
              }
            }
          });

          // Animación manual: dibuja de izquierda a derecha
          const duration = 2000;
          const start = performance.now();
          function animate(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            chart.options.plugins.drawLine.progress = progress;
            chart.draw();
            if (progress < 1) requestAnimationFrame(animate);
          }
          requestAnimationFrame(animate);
          observer.disconnect();
        }
      });
    });
    observer.observe(document.getElementById('grafico-chilenos'));
  </script>
</body>
</html>
